name: Briefly Scheduled News Ingestion

on:
  schedule:
    # 03:00 GMT (Morning Edition)
    - cron: '0 3 * * *'
    # 09:30 GMT (Lunch Briefing)
    - cron: '30 9 * * *'
    # 14:30 GMT (Evening Wrap-Up)
    - cron: '30 14 * * *'
    # 19:00 GMT (Overnight Sweep)
    - cron: '0 19 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run European news ingestion pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run ingest

      - name: Commit and push fresh edition data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new stories or changes to commit."
          else
            git commit -m "chore(feed): automated scheduled briefing update [skip ci]"
            git push origin main
          fi
